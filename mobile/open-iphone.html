<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MATRIX — iPhone</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:"Segoe UI",Tahoma,sans-serif; background:#0b1220; color:#e8eef9; }
    .box { text-align:center; padding:28px; border:1px solid #243049; border-radius:16px; background:#121a2b; max-width:480px; width:92%; }
    h1 { margin:0 0 8px; }
    .ok { color:#22c55e; font-weight:700; margin-bottom:10px; }
    .warn { color:#f59e0b; font-size:13px; margin-bottom:12px; text-align:right; line-height:1.7; }
    img { width:240px; height:240px; background:#fff; padding:12px; border-radius:12px; }
    code { display:block; margin-top:12px; padding:12px; background:#0b1220; border-radius:8px; color:#2dd4bf; direction:ltr; font-size:15px; word-break:break-all; }
    .steps { text-align:right; margin-top:16px; color:#c7d2e5; line-height:1.95; font-size:14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>MATRIX</h1>
    <div class="ok">تم إصلاح الرابط · IP الجديد</div>
    <div class="warn">الرابط القديم (.144) لم يعد صالحاً لأن عنوان الشبكة تغيّر. استخدم الرابط أدناه فقط.</div>
    <img src="expo-qr.png" alt="Expo QR" />
    <code>exp://192.168.8.100:8081</code>
    <div class="steps">
      1) Expo Go → Home → Enter URL<br />
      2) الصق الرابط أعلاه<br />
      3) أو سفاري: http://192.168.8.100:8081
    </div>
  </div>
</body>
</html>
